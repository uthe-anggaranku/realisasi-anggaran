<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5cab">
  <title>Sistem Informasi Realisasi Anggaran</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230b66c3%22%2F%3E%0A%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M18%2023h28v5H18zm4%207h20v18H22zm-7%2018h34v5H15z%22%2F%3E%0A%3Cpath%20fill%3D%22%23dbeafe%22%20d%3D%22M26%2035h4v9h-4zm8%200h4v9h-4z%22%2F%3E%0A%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M29%2016h6v7h-6z%22%2F%3E%0A%3C%2Fsvg%3E">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb}
    body{overflow:hidden}

    .app-wrap{
      position:relative;
      width:100%;
      height:100vh;
      background:#fff
    }

    #appFrame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff
    }

    .loading{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:#fff;
      z-index:5;
      transition:opacity .25s ease
    }
    .loading.hide{opacity:0;pointer-events:none}
    .loading-box{text-align:center;color:#425466}
    .spinner{
      width:38px;height:38px;border-radius:50%;
      border:4px solid #dce8f5;
      border-top-color:#0b66c3;
      animation:spin .8s linear infinite;
      margin:0 auto 14px
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .fallback{
      position:absolute;inset:0;
      display:none;
      align-items:center;justify-content:center;
      background:#f7f9fc;
      z-index:4;
      padding:25px
    }
    .fallback.show{display:flex}
    .fallback-card{
      width:min(560px,100%);
      background:#fff;
      border-radius:16px;
      padding:30px;
      box-shadow:0 10px 35px rgba(18,52,86,.12);
      border:1px solid #e4ebf3;
      text-align:center
    }
    .fallback-icon{font-size:42px;margin-bottom:10px}
    .fallback h2{margin:0 0 10px;color:#183b56;font-size:21px}
    .fallback p{margin:0 0 20px;color:#617386;font-size:14px;line-height:1.6}
    .open-btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:190px;padding:12px 18px;border-radius:9px;
      background:#0b66c3;color:#fff;text-decoration:none;
      font-weight:700;font-size:14px
    }
    .open-btn:hover{background:#0956a5}

    if (!APP_URL || APP_URL.includes('PASTE_URL_V6_2')) {
      showFallback();
      openApp.removeAttribute('href');
      openApp.textContent = 'Masukkan URL V6.2 terlebih dahulu';
      openApp.style.opacity = '.65';
      openApp.style.pointerEvents = 'none';
    } else {
      openApp.href = APP_URL;
      frame.src = APP_URL;

      /*
        iframe tidak dapat membaca isi halaman lintas-domain.
        Karena itu kita tidak mencoba menyentuh DOM V6.2.
        Ini menjaga V6.2 tetap utuh.
      */
      frame.addEventListener('load', function(){
        loading.classList.add('hide');
      });

      /*
        Jika browser menolak iframe karena kebijakan X-Frame-Options,
        tombol "Buka Aplikasi V6.2" tetap tersedia.
        Kita beri waktu beberapa detik sebelum menampilkan fallback.
      */
      setTimeout(function(){
        if (!loading.classList.contains('hide')) {
          showFallback();
        }
      }, 7000);
    }
  </script>
</body>
</html>
